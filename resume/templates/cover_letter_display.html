<!-- cover_letter_display.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Cover Letter</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa; /* Light gray background */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            padding: 20px;
        }
        .cover-letter {
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-top: 20px;
        }
        h1 {
            font-size: 36px;
            text-align: center;
            margin-bottom: 20px;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .download-link {
            display: block;
            margin-top: 20px;
            text-align: center;
        }
        a {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            text-decoration: none;
        }
        a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Generated Cover Letter</h1>
        <div class="cover-letter">
            <p>{{ cover_letter.generated_text }}</p>
            <div class="download-link">
                <button class="btn btn-dark" onclick="downloadResume()">Download Cover Letter</button>
                <a href="{% url 'home'%}">Back to Dashboard</a>

            </div>
        </div>
    </div>
    <script>
        function downloadResume() {
            // Replace 'data' with the content of the generated resume
            let data = document.querySelector('.generated-text').innerText;
            // Create a Blob containing the resume content
            let blob = new Blob([data], { type: 'text/plain' });

            // Create a link element and trigger the download
            let a = document.createElement('a');
            a.href = window.URL.createObjectURL(blob);
            a.download = 'generated_resume.txt';
            a.click();
        }
    </script>
</body>
</html>
