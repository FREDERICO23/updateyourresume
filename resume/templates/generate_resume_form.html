{% extends 'base.html' %}
{% load static %}

{% block title %}Update Resume |UpdateYourResume{% endblock title %}
{% block link %}
<link href="bootstrap/css/bootstrap.min.css" rel="stylesheet"> 
<link href="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.0.3/css/font-awesome.css" rel="stylesheet"> 

<link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/updateyourresumefavicon.png' %}">

<link rel="canonical" href="https://www.updateyourresume.xyz/" />

<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.5.0/lottie.js'></script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script>
<link rel="stylesheet" type="text/css" href="{% static 'popup.css' %}">  

{% endblock %}

{% block content %}

    <div class="container">
      <br>
        <h1>Update your Resume</h1>
        <form id="resumeForm" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6">
                    <div class="card">

                        <div class="card-header text-white bg-primary">
                          <h4 class="card-title">Job Post</h4>  
                        </div>
                      
                        <div class="card-body">
                      
                          <label for="job_title">Job Title:</label>
                      
                          <input type="text" class="form-control" name="job_title" 
                            placeholder="Enter job title" required>
                      
                          <label class="mt-3" for="job_description">Job Description:</label>
                          
                          <textarea class="form-control" name="job_description" id='job_description' rows="3"
                            placeholder="Paste job description" required></textarea>
                      
                        </div>
                      
                      </div>
                </div>
                
                <div class="col-md-6">
                    <div class="card">

                        <div class="card-header text-white bg-primary">
                          <h4 class="card-title">Your Resume</h4>
                        </div>
                      
                        <div class="card-body">
                      
                          <label>Existing Resume:</label>
                          
                          <textarea class="form-control" name="existing_resume_text" rows="3" placeholder="Paste resume text"></textarea>
                        <p class="text-center">or</p>
                          <div class="mt-3 text-center">
                            <label class="btn btn-primary">
                              <input type="file" name="existing_resume_file" accept=".pdf,.docx" required>
                              Upload Resume  
                            </label>
                          </div>
                      
                        </div>
                      
                      </div>
                    </div>
                </div>
            </div>
            <br>
              
            <div class="text-center">             
              <button class="btn btn-primary btn-lg text-center" type="submit" id="generateButton">
                <span id="buttonText">Generate Resume</span>
                {% comment %} <span id="buttonSpinner" class="visually-hidden"> <!-- Initially hidden -->
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Generating...
                </span> {% endcomment %}
            </button>    
          </div>

       <!-- Popup card for job landing advice (initially hidden) -->
        <div id="advicePopup" class="card advice-popup-card" style="display: none;">
            <div class="card-header bg-primary text-white ">Job Tips you should Know</div>
            <div class="card-body">
                <p id="adviceText"></p>
                
                <button onclick="closeAdvicePopup()" class="btn btn-primary">Next Tip</button>
                <br></br>
                <div class="progress progress-striped active">
                  <div class="progress-bar progress-bar-success" style="width: 0%"></div>
                </div>
            </div>
           
        </div>         
        </form>
        
    </div>
    <script>
      const resumeForm = document.getElementById('resumeForm');
      const advicePopup = document.getElementById('advicePopup');
      const adviceText = document.getElementById('adviceText');
  
      const jobLandingAdvices = [
          "Tailor your resume for each job application.",
          "Use specific examples to demonstrate your skills.",
          "Highlight your achievements rather than just listing duties.",
          "Network with professionals in your industry.",
          // Add more advices as needed
      ];
  
      const showAdvicePopup = () => {
          const randomAdvice = jobLandingAdvices[Math.floor(Math.random() * jobLandingAdvices.length)];
          adviceText.textContent = randomAdvice;
          advicePopup.style.display = 'block';
      };
  
      resumeForm.addEventListener('submit', () => {
          showAdvicePopup(); // Show the popup when the form is submitted
      });
  </script>
  <script>
    // Set the width to animate the progress bar 
    // Along with time duration in milliseconds 
    $(".progress-bar").animate({
      width: "70%",
    },40000);
  </script>
{% endblock %}
