{% extends 'base.html' %}
{% load static %}

{% block title %}Update Resume |UpdateYourResume{% endblock title %}

{% block content %}

    <div class="container">
      <br>
        <h1>Update your Resume</h1>
        <form id="resumeForm" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6">
                    <div class="card">

                        <div class="card-header text-white bg-primary">
                          <h4 class="card-title">Job Post</h4>  
                        </div>
                      
                        <div class="card-body">
                      
                          <label for="job_title">Job Title:</label>
                      
                          <input type="text" class="form-control" name="job_title" 
                            placeholder="Enter job title" required>
                      
                          <label class="mt-3" for="job_description">Job Description:</label>
                          
                          <textarea class="form-control" name="job_description" id='job_description' rows="3"
                            placeholder="Paste job description" required></textarea>
                      
                        </div>
                      
                      </div>
                </div>
                
                <div class="col-md-6">
                    <div class="card">

                        <div class="card-header text-white bg-primary">
                          <h4 class="card-title">Your Resume</h4>
                        </div>
                      
                        <div class="card-body">
                      
                          <label>Existing Resume:</label>
                          
                          <textarea class="form-control" name="existing_resume_text" rows="3" placeholder="Paste resume text"></textarea>
                        <p class="text-center">or</p>
                          <div class="mt-3 text-center">
                            <label class="btn btn-primary">
                              <input type="file" name="existing_resume_file" accept=".pdf,.docx" required>
                              Upload Resume  
                            </label>
                          </div>
                      
                        </div>
                      
                      </div>
                    </div>
                </div>
            </div>
            <br>
              
            <div class="text-center">             
              <button class="btn btn-primary btn-lg text-center" type="submit" id="generateButton">
                <span id="buttonText">Generate Resume</span>
                <span id="buttonSpinner" class="visually-hidden"> <!-- Initially hidden -->
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Generating...
                </span>
            </button>    
          </div>
           
        </form>
        
    </div>
    <script>
     // Get the form, button, button text, and button spinner elements
    const resumeForm = document.getElementById('resumeForm');
    const generateButton = document.getElementById('generateButton');
    const buttonText = document.getElementById('buttonText');
    const buttonSpinner = document.getElementById('buttonSpinner');

    // Function to show loading text and disable the button
    const showLoading = () => {
        generateButton.disabled = true; // Disable the button
        buttonText.style.display = 'none'; // Hide button text
        buttonSpinner.classList.remove('d-none'); // Show loading spinner
    };

    // Add submit event listener to the form
    resumeForm.addEventListener('submit', (event) => {
        event.preventDefault(); // Prevent default form submission

        showLoading(); // Show loading text
        
        // Perform your form submission or other processing here
        // For demonstration purposes, simulating a process completion after 3 seconds
        setTimeout(() => {
            // Simulate form submission by submitting the form after process completion
            resumeForm.submit();
        }, 3000); // Change 3000 to your process duration in milliseconds
    });


      </script>

 
{% endblock %}
