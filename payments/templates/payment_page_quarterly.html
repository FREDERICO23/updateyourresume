{% extends 'base.html' %}
{% load static %}

{% block link %}
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
{% endblock %}

{% block title %} Payment Page | UpdateYourResume{% endblock title %}
{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h4>Complete Your Payment</h4>
                    </div>
                    <div class="card-body">
                        {% if error %}
                            <div class="alert alert-danger">
                                {{ error }}
                            </div>
                        {% endif %}
                        <form method="post" action="{% url 'payment_page_quarterly' %}">
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" class="form-control" id="email" value="{{ user.email }}" readonly>
                            </div>
                            <div class="form-group">
                                <label for="plan">Plan</label>
                                <input type="text" class="form-control" id="plan" value="Quarterly Plan - $24/month" readonly>
                            </div>
                            <button type="submit" class="btn btn-block" style="background-color: #080059; color: white;">Pay $24</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
